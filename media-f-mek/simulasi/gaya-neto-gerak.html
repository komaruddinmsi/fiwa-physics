<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaya neto dan keadaan gerak</title><link rel="stylesheet" href="sim.css"></head><body>
<h1>Gaya neto dan keadaan gerak</h1>
<p class="sub">Dorong peti, lalu <b>lepaskan dorongannya</b> saat peti sedang meluncur. Perhatikan apakah peti berhenti seketika atau melambat dulu — dan perhatikan bahwa tidak pernah ada panah gaya ke depan yang &ldquo;membawa&rdquo; peti.</p>
<div class="grid">
  <div class="kotak"><canvas id="kanvas" width="620" height="330"></canvas></div>
  <div class="kotak atur">
    <div class="baris"><label for="m">Massa peti</label><input type="range" id="m" min="5" max="60" step="1" value="20"><output id="om">20 kg</output></div>
    <div class="baris"><label for="dor">Dorongan</label><input type="range" id="dor" min="0" max="120" step="5" value="60"><output id="odor">60 N</output></div>
    <div class="baris"><label for="ges">Gesekan</label><input type="range" id="ges" min="0" max="80" step="5" value="20"><output id="oges">20 N</output></div>
    <h2>Yang terbaca</h2>
    <div class="baris"><label>Gaya neto ΣF</label><span></span><output id="osf">—</output></div>
    <div class="baris"><label>Percepatan a</label><span></span><output id="oa">—</output></div>
    <div class="baris"><label>Kecepatan v</label><span></span><output id="ov">—</output></div>
    <p id="kabar" class="sub" style="margin:4px 0 0"></p>
    <div class="tombol">
      <button id="jalan">Jalankan</button>
      <button id="lepas" class="ghost">Lepaskan dorongan</button>
      <button id="ulang" class="ghost">Ulangi</button>
    </div>
  </div>
</div>
<script>
(function(){
  "use strict";
  var K=document.getElementById('kanvas'), c=K.getContext('2d');
  var $=function(i){return document.getElementById(i)};
  var x=60, v=0, jalan=false, dilepas=false, t0=0;
  function fisika(dt){
    var m=+$('m').value, F=dilepas?0:+$('dor').value, f=+$('ges').value;
    var neto;
    if (v>0.001)      neto = F - f;                       // meluncur: gesekan melawan gerak
    else if (F>f)     neto = F - f;                       // diam, dorongan menang
    else              neto = 0;                           // diam, tidak cukup untuk bergerak
    var a = neto/m;
    v += a*dt;
    if (v<0) { v=0; }                                     // gesekan tidak mendorong mundur
    x += v*dt*18;
    if (x>K.width-90){ x=K.width-90; v=0; }
    return {neto:neto, a:a, m:m, F:F, f:f};
  }
  function panah(x1,y,p,warna,label){
    if(Math.abs(p)<1) return;
    c.strokeStyle=warna; c.fillStyle=warna; c.lineWidth=3.5;
    var x2=x1+p; c.beginPath(); c.moveTo(x1,y); c.lineTo(x2,y); c.stroke();
    var d=p>0?1:-1;
    c.beginPath(); c.moveTo(x2,y); c.lineTo(x2-11*d,y-6); c.lineTo(x2-11*d,y+6); c.closePath(); c.fill();
    c.font='600 12px system-ui'; c.fillText(label, x1+p/2-18, y-12);
  }
  function gambar(r){
    var W=K.width,H=K.height,lantai=H-70;
    c.clearRect(0,0,W,H);
    c.strokeStyle='rgba(140,180,255,.45)'; c.lineWidth=2;
    c.beginPath(); c.moveTo(0,lantai); c.lineTo(W,lantai); c.stroke();
    for(var g=0; g<W; g+=40){ c.strokeStyle='rgba(120,160,255,.16)'; c.beginPath();
      c.moveTo(g,lantai); c.lineTo(g-10,lantai+12); c.stroke(); }
    var w=60,h=46;
    c.fillStyle='rgba(0,201,167,.26)'; c.strokeStyle='#00c9a7'; c.lineWidth=2;
    c.fillRect(x,lantai-h,w,h); c.strokeRect(x,lantai-h,w,h);
    c.fillStyle='#eaf0ff'; c.font='600 13px system-ui'; c.fillText(r.m+' kg', x+10, lantai-18);
    var yp=lantai-h-34;
    panah(x+w, yp, r.F*1.1, '#ffc247', 'dorong '+r.F+' N');
    panah(x, yp+26, -r.f*1.1, '#ff7a7a', 'gesek '+r.f+' N');
    panah(x+w/2, 46, r.neto*1.1, '#b48cff', 'ΣF = '+r.neto.toFixed(0)+' N');
    c.fillStyle='#9db0e6'; c.font='12px system-ui';
    c.fillText('Tidak ada panah ke depan yang "membawa" peti — yang ada hanya dorongan dan gesekan.', 14, H-18);
  }
  function bingkai(ts){
    var dt = t0 ? Math.min((ts-t0)/1000, 0.05) : 0; t0=ts;
    var r = jalan ? fisika(dt) : fisika(0);
    gambar(r);
    $('osf').textContent = r.neto.toFixed(0)+' N';
    $('oa').textContent  = r.a.toFixed(2)+' m/s²';
    $('ov').textContent  = v.toFixed(2)+' m/s';
    $('kabar').innerHTML = !jalan ? 'Tekan <b>Jalankan</b>.'
      : dilepas ? (v>0.01 ? 'Dorongan sudah hilang, tetapi peti <b>masih meluncur</b> dan melambat bertahap — gesekanlah yang menghentikannya, bukan hilangnya dorongan.'
                          : 'Peti berhenti. Perhatikan: ia butuh waktu, tidak berhenti seketika.')
      : (Math.abs(r.neto)<1 ? 'ΣF = 0. Peti <b>tidak harus diam</b> — ia dapat terus meluncur dengan kecepatan tetap.'
                            : 'ΣF ≠ 0, jadi kecepatannya berubah.');
    requestAnimationFrame(bingkai);
  }
  ['m','dor','ges'].forEach(function(i){ $(i).addEventListener('input',function(){
    $('o'+i).textContent = $(i).value + (i==='m'?' kg':' N'); }); });
  $('jalan').addEventListener('click',function(){ jalan=true; });
  $('lepas').addEventListener('click',function(){ dilepas=true; jalan=true; });
  $('ulang').addEventListener('click',function(){ x=60; v=0; jalan=false; dilepas=false; });
  requestAnimationFrame(bingkai);
})();
</script></body></html>
