<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momen gaya dan kesetimbangan</title><link rel="stylesheet" href="sim.css"></head><body>
<h1>Momen gaya dan kesetimbangan</h1>
<p class="sub">Geser kedua beban. Jumlah gayanya boleh saja nol, tetapi batangnya tetap berputar bila jumlah momennya tidak nol — <b>dua syarat, bukan satu</b>. Perhatikan juga: beban yang lebih berat justru harus <b>lebih dekat</b> ke poros.</p>
<div class="grid">
  <div class="kotak"><canvas id="kanvas" width="620" height="340"></canvas></div>
  <div class="kotak atur">
    <div class="baris"><label for="w1">Beban kiri</label><input type="range" id="w1" min="10" max="120" step="5" value="60"><output id="ow1">60 N</output></div>
    <div class="baris"><label for="d1">Jarak kiri</label><input type="range" id="d1" min="0.2" max="2" step="0.1" value="1"><output id="od1">1,0 m</output></div>
    <div class="baris"><label for="w2">Beban kanan</label><input type="range" id="w2" min="10" max="120" step="5" value="30"><output id="ow2">30 N</output></div>
    <div class="baris"><label for="d2">Jarak kanan</label><input type="range" id="d2" min="0.2" max="2" step="0.1" value="2"><output id="od2">2,0 m</output></div>
    <h2>Yang terbaca</h2>
    <div class="baris"><label>Momen kiri</label><span></span><output id="ot1">—</output></div>
    <div class="baris"><label>Momen kanan</label><span></span><output id="ot2">—</output></div>
    <div class="baris"><label>Jumlah momen</label><span></span><output id="ost">—</output></div>
    <div class="baris"><label>Gaya tumpuan</label><span></span><output id="osf">—</output></div>
    <p id="kabar" class="sub" style="margin:4px 0 0"></p>
    <div class="tombol"><button id="setimbang" class="ghost">Carikan titik setimbang</button></div>
  </div>
</div>
<script>
(function(){
  "use strict";
  var K=document.getElementById('kanvas'), c=K.getContext('2d');
  var $=function(i){return document.getElementById(i)};
  var sudut=0, vsudut=0, t0=0;
  function perbarui(ts){
    var dt = t0 ? Math.min((ts-t0)/1000,0.05) : 0; t0=ts;
    var w1=+$('w1').value, d1=+$('d1').value, w2=+$('w2').value, d2=+$('d2').value;
    $('ow1').textContent=w1+' N'; $('ow2').textContent=w2+' N';
    $('od1').textContent=d1.toFixed(1).replace('.',',')+' m';
    $('od2').textContent=d2.toFixed(1).replace('.',',')+' m';
    var t1=w1*d1, t2=w2*d2, st=t2-t1;
    vsudut += (st/900)*dt; vsudut *= 0.985; sudut += vsudut*dt;
    sudut = Math.max(-0.26, Math.min(0.26, sudut));
    if (Math.abs(sudut)>=0.259) vsudut=0;
    var W=K.width,H=K.height,px=W/2,py=175,L=215;
    c.clearRect(0,0,W,H);
    c.save(); c.translate(px,py); c.rotate(sudut);
    c.strokeStyle='#9fbcff'; c.lineWidth=9; c.lineCap='round';
    c.beginPath(); c.moveTo(-L,0); c.lineTo(L,0); c.stroke();
    function beban(d,w,sisi,warna){
      var x=sisi*d/2*L, h=18+w*0.42;
      c.fillStyle=warna.replace('1)','.3)'); c.strokeStyle=warna; c.lineWidth=2;
      c.fillRect(x-19,-h-6,38,h); c.strokeRect(x-19,-h-6,38,h);
      c.fillStyle='#eaf0ff'; c.font='600 12px system-ui'; c.textAlign='center';
      c.fillText(w+' N', x, -h+10);
      c.strokeStyle=warna; c.setLineDash([4,4]); c.lineWidth=1.4;
      c.beginPath(); c.moveTo(x,6); c.lineTo(x,30); c.stroke(); c.setLineDash([]);
      c.fillStyle=warna; c.font='11px system-ui';
      c.fillText(d.toFixed(1).replace('.',',')+' m', x, 44); c.textAlign='left';
    }
    beban(d1,w1,-1,'rgba(0,201,167,1)'); beban(d2,w2,1,'rgba(255,194,71,1)');
    c.restore();
    c.fillStyle='#b48cff'; c.beginPath();
    c.moveTo(px,py+6); c.lineTo(px-26,py+62); c.lineTo(px+26,py+62); c.closePath(); c.fill();
    c.fillStyle='#9db0e6'; c.font='12px system-ui'; c.textAlign='center';
    c.fillText('poros', px, py+80); c.textAlign='left';
    $('ot1').textContent=t1.toFixed(1)+' N m'; $('ot2').textContent=t2.toFixed(1)+' N m';
    $('ost').textContent=(st>=0?'+':'')+st.toFixed(1)+' N m';
    $('osf').textContent=(w1+w2)+' N';
    $('kabar').innerHTML = Math.abs(st)<0.5
      ? 'Στ = 0 <b>dan</b> ΣF = 0: batang setimbang. Perhatikan beban yang lebih berat — ia berada lebih <b>dekat</b> ke poros, bukan lebih jauh.'
      : 'ΣF tetap nol karena tumpuan menahan seluruh berat, tetapi Στ ≠ 0 — jadi batang <b>berputar</b>. Jumlah gaya nol saja tidak cukup.';
    requestAnimationFrame(perbarui);
  }
  ['w1','d1','w2','d2'].forEach(function(i){ $(i).addEventListener('input',function(){ vsudut=0; }); });
  $('setimbang').addEventListener('click',function(){
    var w1=+$('w1').value, d1=+$('d1').value, w2=+$('w2').value;
    var d2=Math.max(0.2, Math.min(2, (w1*d1)/w2));
    $('d2').value=d2.toFixed(1); sudut=0; vsudut=0;
  });
  requestAnimationFrame(perbarui);
})();
</script></body></html>
